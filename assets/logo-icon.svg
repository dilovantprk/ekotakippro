<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Renk Gradyanları -->
    <!-- 1. Çubuk (En Açık Yeşil) -->
    <linearGradient id="bar1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBEB45" />
      <stop offset="100%" stop-color="#76C828" />
    </linearGradient>

    <!-- 2. Çubuk (Orta Yeşil) -->
    <linearGradient id="bar2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80D639" />
      <stop offset="100%" stop-color="#22963B" />
    </linearGradient>

    <!-- 3. Çubuk (Koyu Yeşil) -->
    <linearGradient id="bar3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3FA836" />
      <stop offset="100%" stop-color="#116A2E" />
    </linearGradient>

    <!-- Ön Yaprak Gradyanı -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5CC83B" />
      <stop offset="50%" stop-color="#24973B" />
      <stop offset="100%" stop-color="#0E5728" />
    </linearGradient>

    <!-- Gölge Efekti (Derinlik için) -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="-2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <g transform="translate(10, 15)">
    <!-- 1. Büyüme Çubuğu (Sol - Küçük) -->
    <path d="M 125,240 
             Q 125,230 135,230 
             L 175,230 
             Q 190,230 190,245 
             L 190,360 
             Q 160,365 125,360 Z" 
          fill="url(#bar1Grad)" />
    <!-- Sol Çubuk Yuvarlatılmış Sol Üst Detay -->
    <path d="M 125,240 Q 125,230 135,230 L 140,230 Q 125,250 125,270 Z" fill="#D2F14C" opacity="0.8" />

    <!-- 2. Büyüme Çubuğu (Orta) -->
    <path d="M 205,190 
             Q 205,180 215,180 
             L 255,180 
             Q 270,180 270,195 
             L 270,320 
             Q 230,340 205,310 Z" 
          fill="url(#bar2Grad)" />
    <!-- Orta Çubuk Üst Işık Detayı -->
    <path d="M 205,190 Q 205,180 215,180 L 220,180 Q 205,200 205,220 Z" fill="#9AE347" opacity="0.8" />

    <!-- 3. Büyüme Çubuğu (Sağ - Uzun) -->
    <path d="M 285,135 
             Q 285,125 295,125 
             L 335,125 
             Q 350,125 350,140 
             L 350,250 
             Q 310,280 285,250 Z" 
          fill="url(#bar3Grad)" />
    <!-- Sağ Çubuk Üst Işık Detayı -->
    <path d="M 285,135 Q 285,125 295,125 L 300,125 Q 285,145 285,165 Z" fill="#58C43E" opacity="0.8" />

    <!-- Ön Yaprak ve Kıvrımlı Gövde (Main Leaf) -->
    <path d="M 180,420 
             C 170,430 155,420 165,400 
             C 185,360 210,310 250,270 
             C 300,220 345,150 365,150 
             C 365,150 380,220 375,270 
             C 365,330 310,380 230,385 
             C 200,387 185,405 180,420 Z" 
          fill="url(#leafGrad)" 
          filter="url(#shadow)" />

    <!-- Yaprak Damarı / Beyaz Kavisli Çizgi -->
    <path d="M 172,408 
             C 200,350 240,290 290,235 
             C 325,195 355,160 368,148 
             C 360,170 330,220 285,268 
             C 235,320 190,375 172,408 Z" 
          fill="#FFFFFF" 
          opacity="0.95" />
  </g>
</svg>